[package]
name = "felix"
version = "0.1.0"
edition = "2024"

[dependencies]
gtk4 = "0.11.4"
gtk4-layer-shell = "0.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
notify = "7.0.0"
sysinfo = "0.39.6"
evdev = "0.13.2"
ksni = { version = "0.3.6", features = ["blocking"] }
cairo-rs = { version = "0.22.0", features = ["png"] }
reqwest = {version = "0.13.4", features = ["blocking", "json"]}
log = "0.4"
env_logger = "0.11"

[features]
default = ["hyprland"]
hyprland = []

