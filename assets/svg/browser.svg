<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Light blue globe fill -->
  <circle 
    cx="128" 
    cy="128" 
    r="112" 
    fill="rgb(51, 153, 230)" 
    fill-opacity="0.85" 
  />

  <!-- Globe outline -->
  <circle 
    cx="128" 
    cy="128" 
    r="112" 
    stroke="rgb(230, 242, 255)" 
    stroke-opacity="0.5" 
    stroke-width="8" 
    fill="none" 
  />

  <!-- Crosshairs / Equator & Prime Meridian -->
  <path 
    d="M 16 128 L 240 128 M 128 16 L 128 240" 
    stroke="rgb(230, 242, 255)" 
    stroke-opacity="0.5" 
    stroke-width="8" 
    fill="none" 
  />
</svg>
