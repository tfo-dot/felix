name: Build Windows Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up MSYS2
      id: msys2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gtk4
          mingw-w64-x86_64-pkg-config
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-rust

    - name: Build release binary
      run: cargo build --release

    - name: Package release artifact
      run: |
        mkdir -p felix-windows
        cp target/release/felix.exe felix-windows/
        cp -r assets felix-windows/
        cp /mingw64/bin/*.dll felix-windows/

    - name: Compress release package
      shell: pwsh
      run: Compress-Archive -Path felix-windows -DestinationPath felix-windows.zip -Force

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: felix-windows
        path: felix-windows.zip
